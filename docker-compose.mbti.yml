services:
  # 매월 1일 00:05(Asia/Seoul)에 직전 월 MBTI 분석 대상을 작업 큐에 등록한다.
  mbti-scheduler:
    build:
      context: ./app
      dockerfile: Dockerfile
    container_name: wellness_mbti_scheduler
    restart: always
    command: >
      sh -c "until python manage.py migrate --check; do sleep 5; done &&
             python manage.py run_mbti_monthly_scheduler"
    env_file:
      - ./.env
    volumes:
      - ./app:/app
      - ./ai:/ai
      - ./etl:/etl:ro
    environment:
      DJANGO_SETTINGS_MODULE: config.settings
      PG_HOST: db
      PG_PORT: "5432"
      PG_DB: ${PG_DB:-wellness_db}
      PG_USER: ${PG_USER:-postgres}
      PG_PASSWORD: ${PG_PASSWORD:-password}
      MBTI_MONTHLY_RUN_HOUR: ${MBTI_MONTHLY_RUN_HOUR:-0}
      MBTI_MONTHLY_RUN_MINUTE: ${MBTI_MONTHLY_RUN_MINUTE:-5}
    depends_on:
      - web

  # pending 작업을 한 번에 하나씩 처리해 월초 LLM 호출량을 제한한다.
  mbti-worker:
    build:
      context: ./app
      dockerfile: Dockerfile
    container_name: wellness_mbti_worker
    restart: always
    command: >
      sh -c "until python manage.py migrate --check; do sleep 5; done &&
             python manage.py run_mbti_monthly_worker"
    env_file:
      - ./.env
    volumes:
      - ./app:/app
      - ./ai:/ai
      - ./etl:/etl:ro
    environment:
      DJANGO_SETTINGS_MODULE: config.settings
      PG_HOST: db
      PG_PORT: "5432"
      PG_DB: ${PG_DB:-wellness_db}
      PG_USER: ${PG_USER:-postgres}
      PG_PASSWORD: ${PG_PASSWORD:-password}
      MBTI_WORKER_POLL_SECONDS: ${MBTI_WORKER_POLL_SECONDS:-5}
      MBTI_WORKER_MAX_RETRIES: ${MBTI_WORKER_MAX_RETRIES:-2}
      MBTI_WORKER_RETRY_DELAY_SECONDS: ${MBTI_WORKER_RETRY_DELAY_SECONDS:-900}
      MBTI_WORKER_STALE_AFTER_SECONDS: ${MBTI_WORKER_STALE_AFTER_SECONDS:-3600}
    depends_on:
      - web
