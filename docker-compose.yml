version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: wellness_postgres
    restart: always
    environment:
      POSTGRES_DB: ${PG_DB:-wellness_db}
      POSTGRES_USER: ${PG_USER:-postgres}
      POSTGRES_PASSWORD: ${PG_PASSWORD:-password}
    ports:
      - "${PG_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  neo4j:
    image: neo4j:5.12.0-community
    container_name: wellness_neo4j
    restart: always
    ports:
      - "7474:7474" # Web Browser UI
      - "${NEO4J_PORT:-7687}:7687" # Bolt protocol
    environment:
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-password}
      NEO4J_PLUGINS: '["apoc"]'
    volumes:
      - neo4j_data:/data
      - neo4j_import:/import
      - neo4j_plugins:/plugins

  web:
    build:
      context: ./app/backend
      dockerfile: Dockerfile
    container_name: wellness_django
    restart: always
    command: >
      sh -c "python manage.py migrate &&
             python manage.py load_tarot_data &&
             python manage.py runserver 0.0.0.0:8000 --noreload"
    env_file:
      - ./app/backend/.env
    volumes:
      - ./app/backend:/app
    ports:
      - "8000:8000"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - PG_HOST=db
      - PG_PORT=5432
      - PG_DB=${PG_DB:-wellness_db}
      - PG_USER=${PG_USER:-postgres}
      - PG_PASSWORD=${PG_PASSWORD:-password}
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=${NEO4J_USER:-neo4j}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:-password}
      - FRONTEND_BASE_URL=${FRONTEND_BASE_URL:-http://localhost:5173}
      - KAKAO_CLIENT_ID=${KAKAO_CLIENT_ID:-}
      - KAKAO_REDIRECT_URI=${KAKAO_REDIRECT_URI:-http://localhost:5173/login/callback/kakao}
      - KAKAO_SCOPE=${KAKAO_SCOPE:-profile_nickname account_email}
      - NAVER_CLIENT_ID=${NAVER_CLIENT_ID:-}
      - NAVER_REDIRECT_URI=${NAVER_REDIRECT_URI:-http://localhost:5173/login/callback/naver}
      - NAVER_SCOPE=${NAVER_SCOPE:-}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_REDIRECT_URI=${GOOGLE_REDIRECT_URI:-http://localhost:5173/login/callback/google}
      - GOOGLE_SCOPE=${GOOGLE_SCOPE:-openid email profile}
    depends_on:
      - db
      - neo4j

volumes:
  postgres_data:
  neo4j_data:
  neo4j_import:
  neo4j_plugins:
