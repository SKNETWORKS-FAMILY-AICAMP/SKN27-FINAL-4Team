# v6.0 (최종 확정 아키텍처): PostgreSQL 단일 DB 구성
# - Neo4j 제거 (GraphDB는 2차 확장 — 최종_통합_흐름도 §6)
# - Redis 컨테이너 없음: 시크릿 모드는 서버 인메모리 캐시 사용 (ERD v6.0 §3-2)
# DB 초기화(전체 리셋): docker compose down -v && docker compose up -d --build

services:
  db:
    image: postgres:15-alpine
    container_name: wellness_postgres
    restart: always
    environment:
      POSTGRES_DB: ${PG_DB:-wellness_db}
      POSTGRES_USER: ${PG_USER:-postgres}
      POSTGRES_PASSWORD: ${PG_PASSWORD:-password}
    ports:
      - "${PG_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  web:
    build:
      context: ./app
      dockerfile: Dockerfile
    container_name: wellness_django
    restart: always
    command: >
      sh -c "python manage.py migrate &&
             python manage.py load_tarot_data &&
             python manage.py runserver 0.0.0.0:8000 --noreload"
    env_file:
      - ./app/backend/.env
    volumes:
      - ./app:/app
      # ai/ 패키지 (에이전트·감정모델 코드) — settings.py가 / 를 sys.path에 추가하므로 /ai 로 마운트
      - ./ai:/ai
      - ./etl:/etl:ro
      # 감정분류 학습 산출물 (KcELECTRA+XGBoost) — 없으면 LLM 폴백으로 동작
      - ./ai/emotion/artifacts:/artifacts:ro
      # HuggingFace 모델 캐시 영속화 — 재생성해도 KcELECTRA 재다운로드 안 함 (속도)
      - hf_cache:/root/.cache/huggingface
    ports:
      - "8000:8000"
    environment:
      - EMOTION_ARTIFACT_DIR=/artifacts
      - PG_HOST=db
      - PG_PORT=5432
      - PG_DB=${PG_DB:-wellness_db}
      - PG_USER=${PG_USER:-postgres}
      - PG_PASSWORD=${PG_PASSWORD:-password}
      # LLM — 공급자 선택: openai(기본) / groq
      - LLM_PROVIDER=${LLM_PROVIDER:-openai}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-5.4-mini}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - GROQ_BASE_URL=${GROQ_BASE_URL:-https://api.groq.com/openai/v1}
      - GROQ_MODEL=${GROQ_MODEL:-llama-3.3-70b-versatile}
      # Plan Agent (Tavily)
      - TAVILY_API_KEY=${TAVILY_API_KEY}
      # ElevenLabs TTS
      - ELEVENLABS_API_KEY=${ELEVENLABS_API_KEY}
      - ELEVENLABS_MODEL_ID=${ELEVENLABS_MODEL_ID:-eleven_v3}
      - VOICE_ID_PORI=${VOICE_ID_PORI}
      - VOICE_ID_KKAMI=${VOICE_ID_KKAMI}
      - VOICE_ID_TOTO=${VOICE_ID_TOTO}
      - VOICE_ID_YEOUL=${VOICE_ID_YEOUL}
      # OAuth 소셜 로그인 (SECRET은 루트 .env 또는 app/backend/.env 어디에 있어도 동작)
      - FRONTEND_BASE_URL=${FRONTEND_BASE_URL:-http://localhost:5173}
      - KAKAO_CLIENT_SECRET=${KAKAO_CLIENT_SECRET:-}
      - NAVER_CLIENT_SECRET=${NAVER_CLIENT_SECRET:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - KAKAO_CLIENT_ID=${KAKAO_CLIENT_ID:-}
      - KAKAO_REDIRECT_URI=${KAKAO_REDIRECT_URI:-http://localhost:5173/login/callback/kakao}
      - KAKAO_SCOPE=${KAKAO_SCOPE:-profile_nickname account_email}
      - NAVER_CLIENT_ID=${NAVER_CLIENT_ID:-}
      - NAVER_REDIRECT_URI=${NAVER_REDIRECT_URI:-http://localhost:5173/login/callback/naver}
      - NAVER_SCOPE=${NAVER_SCOPE:-}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_REDIRECT_URI=${GOOGLE_REDIRECT_URI:-http://localhost:5173/login/callback/google}
      - GOOGLE_SCOPE=${GOOGLE_SCOPE:-openid email profile}
    depends_on:
      - db

volumes:
  postgres_data:
  hf_cache:
