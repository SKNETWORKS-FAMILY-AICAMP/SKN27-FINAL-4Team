# 빈틈사이 CodeBuild 명세 (강사 견본 django_on_aws/buildspec.yml 기반)
# CodeBuild 프로젝트 설정에서 Buildspec 경로를 deploy/buildspec.yml 로 지정할 것.
# 필요 권한: ECR push (AmazonEC2ContainerRegistryPowerUser 상당)
version: 0.2

env:
    git-credential-helper: yes
    variables:
        ECS_CONTAINER_NAME: binteumsai-container   # ECS 태스크 정의의 컨테이너명과 일치
        IMAGE_REPO_NAME: binteumsai-ecr            # ECR 저장소 이름
        IMAGE_TAG: latest
        AWS_DEFAULT_REGION: ap-northeast-2

phases:
    pre_build:
        commands:
            - echo Logging in to Amazon ECR...
            - aws --version
            - ECR_PASSWORD=$(aws ecr get-login-password --region $AWS_DEFAULT_REGION)
            - AWS_ACCOUNT_ID=$(aws sts get-caller-identity --query 'Account' --output text)
            - echo -n ${ECR_PASSWORD} | docker login --username AWS --password-stdin ${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_DEFAULT_REGION}.amazonaws.com
            - REPOSITORY_URI=${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_DEFAULT_REGION}.amazonaws.com/${IMAGE_REPO_NAME}:${IMAGE_TAG}

    build:
        commands:
            - echo Build started on `date`
            # 컨텍스트는 저장소 루트, Dockerfile은 deploy/ — 프론트+백엔드 통합 이미지
            - docker build -f ./deploy/Dockerfile -t ${IMAGE_REPO_NAME}:${IMAGE_TAG} .
            - docker tag ${IMAGE_REPO_NAME}:${IMAGE_TAG} ${REPOSITORY_URI}

    post_build:
        commands:
            - echo Push to ECR....
            - docker push ${REPOSITORY_URI}
            # ECS 배포 스테이지가 읽는 이미지 정의 파일
            - printf '[{"name":"%s", "imageUri":"%s"}]' ${ECS_CONTAINER_NAME} ${REPOSITORY_URI} > imagedefinitions.json
            - cat imagedefinitions.json

artifacts:
    files:
        - imagedefinitions.json
