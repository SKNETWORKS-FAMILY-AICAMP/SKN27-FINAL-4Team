# 빈틈사이 운영 nginx — 프론트 정적 서빙 + 백엔드 프록시 (단일 컨테이너 내부)
# 경로 규약 실측(config/urls.py): 백엔드는 /api/*, /admin/*, /media/* 전부.

# ── HTTPS 판별 헤더 보존 (2026-07-21) ─────────────────────────────
#  ALB가 TLS를 종료하고 nginx로는 HTTP:80으로 보낸다 → 여기서 $scheme은 항상 'http'.
#  그대로 X-Forwarded-Proto에 넣으면 ALB가 붙여준 'https'를 덮어써서,
#  Django가 SECURE_PROXY_SSL_HEADER를 켜도 요청을 http로 오인한다.
#  증상: 로그인·채팅 POST가 전부 CSRF 403. (개발에선 재현 안 됨 — 배포에서만 터짐)
#  → ALB 값이 있으면 그걸 쓰고, 없을 때(로컬 단독 실행)만 $scheme으로 폴백.
map $http_x_forwarded_proto $fwd_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 20M;          # 사진 첨부 업로드 여유

    # ── 백엔드 프록시 (gunicorn :8000) ──
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
        proxy_read_timeout 180s;       # LLM 응답 + TTS 생성 대기 여유
    }

    location /admin/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
    }

    # ── 정적/미디어 — 파일은 nginx가 직접 ──
    location /static/ {
        alias /app/backend/staticfiles/;   # collectstatic 산출 (admin 화면용)
    }
    location /media/ {
        alias /app/backend/media/;         # TTS mp3, 마음카드 이미지
    }

    # ── 프론트 SPA — 나머지 전부, 새로고침 대응 fallback ──
    location / {
        root /srv/frontend;
        try_files $uri $uri/ /index.html;
    }
}
